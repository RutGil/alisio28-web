name: Publicar ALISIO28 en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Obtener la dirección de Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Instalar la dependencia del QR
        run: python -m pip install -r requirements.txt
      - name: Preparar la web y adaptar el QR
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python scripts/build.py --base-url "$SITE_BASE_URL" --output _site
          python scripts/check_site.py _site
      - name: Guardar los archivos de la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar la web
        id: deployment
        uses: actions/deploy-pages@v4
